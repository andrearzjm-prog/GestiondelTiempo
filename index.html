<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi Jornada Laboral</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4eee8;
    color:#40352d;
    min-height:100vh;
}

/* ================= INICIO ================= */

.start{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.start-box{
    width:min(1050px,95%);
    min-height:620px;
    background:#fff;
    border-radius:30px;
    overflow:hidden;
    display:grid;
    grid-template-columns:45% 55%;
    box-shadow:0 20px 60px rgba(70,50,35,.16);
}

.start-text{
    padding:55px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.tag{
    font-size:13px;
    font-weight:bold;
    letter-spacing:2px;
    color:#a07959;
    margin-bottom:15px;
}

.start-text h1{
    font-size:48px;
    line-height:1.05;
    color:#49382c;
    margin-bottom:20px;
}

.start-text p{
    font-size:18px;
    line-height:1.6;
    color:#756b63;
    margin-bottom:30px;
}

.start-button{
    border:0;
    background:#73533d;
    color:white;
    padding:17px 32px;
    border-radius:13px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    width:max-content;
    transition:.2s;
}

.start-button:hover{
    background:#583f2f;
    transform:translateY(-3px);
}

/* ================= OFICINA ================= */

.office{
    position:relative;
    background:linear-gradient(#e7ddd2 0 72%,#a97e59 72%);
    overflow:hidden;
}

.window{
    position:absolute;
    top:60px;
    left:50%;
    transform:translateX(-50%);
    width:260px;
    height:155px;
    background:#dceff3;
    border:10px solid white;
}

.window:before{
    content:"";
    position:absolute;
    left:50%;
    height:100%;
    width:5px;
    background:white;
}

.window:after{
    content:"";
    position:absolute;
    top:50%;
    width:100%;
    height:5px;
    background:white;
}

.desk{
    position:absolute;
    bottom:100px;
    left:7%;
    width:86%;
    height:18px;
    background:#79563e;
    border-radius:5px;
}

.desk:before,
.desk:after{
    content:"";
    position:absolute;
    top:15px;
    width:12px;
    height:125px;
    background:#624532;
}

.desk:before{left:25px}
.desk:after{right:25px}

.monitor{
    position:absolute;
    bottom:125px;
    left:50%;
    transform:translateX(-50%);
    width:180px;
    height:110px;
    background:#343638;
    border:7px solid #252729;
    border-radius:10px;
}

.monitor:after{
    content:"";
    position:absolute;
    width:60px;
    height:17px;
    background:#444;
    bottom:-28px;
    left:50%;
    transform:translateX(-50%);
}

.cup{
    position:absolute;
    bottom:135px;
    right:13%;
    width:42px;
    height:35px;
    background:white;
    border-radius:5px 5px 12px 12px;
}

.cup:after{
    content:"";
    position:absolute;
    right:-12px;
    top:7px;
    width:14px;
    height:17px;
    border:4px solid white;
    border-left:0;
    border-radius:0 10px 10px 0;
}

/* ================= PERSONAJES ================= */

.person{
    position:absolute;
    bottom:105px;
    left:50%;
    transform:translateX(-50%);
    width:190px;
    height:300px;
}

.person .head{
    position:absolute;
    top:25px;
    left:51px;
    width:88px;
    height:95px;
    background:#f0c3a2;
    border-radius:45%;
    z-index:3;
}

.person .hair{
    position:absolute;
    top:5px;
    left:40px;
    width:110px;
    height:105px;
    background:#543528;
    border-radius:55% 55% 40% 45%;
    z-index:2;
}

.person .eye{
    position:absolute;
    top:68px;
    width:8px;
    height:10px;
    background:#352720;
    border-radius:50%;
    z-index:4;
}

.person .eye.one{left:68px}
.person .eye.two{left:117px}

.person .mouth{
    position:absolute;
    top:91px;
    left:84px;
    width:23px;
    height:10px;
    border-bottom:3px solid #914d48;
    border-radius:50%;
    z-index:4;
}

.person .body{
    position:absolute;
    top:125px;
    left:32px;
    width:128px;
    height:150px;
    background:#6e5443;
    border-radius:28px 28px 12px 12px;
}

.person .shirt{
    position:absolute;
    left:44px;
    top:0;
    width:40px;
    height:90px;
    background:white;
    clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);
}

.person .arm{
    position:absolute;
    top:10px;
    width:27px;
    height:105px;
    background:#6e5443;
    border-radius:20px;
}

.person .arm.left{
    left:-17px;
    transform:rotate(12deg);
}

.person .arm.right{
    right:-17px;
    transform:rotate(-12deg);
}

.person .badge{
    position:absolute;
    right:12px;
    top:48px;
    font-size:7px;
    background:white;
    padding:5px;
    border-radius:4px;
    color:#71513b;
}

/* Diferentes personajes */

.p2 .hair{background:#2f2927}
.p2 .body{background:#40566a}
.p2 .shirt{background:#e8eef1}

.p3 .hair{
    background:#6d442d;
    height:115px;
}
.p3 .body{background:#80604b}

.p4 .hair{background:#3c302c}
.p4 .body{background:#53656d}

.p5 .hair{background:#8a5a3b}
.p5 .body{background:#76543f}

.p6 .hair{background:#302927}
.p6 .body{background:#4c5f50}

.p7 .hair{background:#54352d}
.p7 .body{background:#765d78}

.p8 .hair{background:#30343a}
.p8 .body{background:#72523d}

/* ================= JUEGO ================= */

.game{
    display:none;
    min-height:100vh;
    padding:20px;
}

.header{
    max-width:1050px;
    margin:auto;
    background:white;
    border-radius:18px;
    padding:16px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 5px 20px rgba(70,50,35,.08);
}

.logo{
    font-weight:bold;
    color:#70513b;
}

.points{
    background:#f2e7dc;
    padding:9px 16px;
    border-radius:20px;
    font-weight:bold;
}

.content{
    max-width:1050px;
    margin:25px auto;
    display:grid;
    grid-template-columns:300px 1fr;
    gap:22px;
}

.scene{
    background:white;
    border-radius:23px;
    min-height:540px;
    position:relative;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(70,50,35,.08);
}

.scene-office{
    position:absolute;
    inset:0;
    background:linear-gradient(#e7ddd2 0 73%,#ae8460 73%);
}

.scene .window{
    top:40px;
    width:190px;
    height:110px;
}

.scene .desk{
    bottom:90px;
    width:90%;
    left:5%;
}

.scene .monitor{
    bottom:115px;
    width:120px;
    height:75px;
}

.scene .cup{
    bottom:120px;
}

.scene .person{
    transform:translateX(-50%) scale(.8);
    transform-origin:bottom center;
    bottom:90px;
}

.character-name{
    position:absolute;
    bottom:22px;
    width:100%;
    text-align:center;
    font-weight:bold;
    color:#5d493b;
    z-index:10;
}

.card{
    background:white;
    border-radius:23px;
    padding:38px;
    box-shadow:0 5px 20px rgba(70,50,35,.08);
}

.progress{
    font-size:13px;
    font-weight:bold;
    color:#a07959;
    letter-spacing:1px;
    margin-bottom:14px;
}

.question{
    font-size:26px;
    line-height:1.4;
    margin-bottom:25px;
}

.answers{
    display:grid;
    gap:12px;
}

.answer{
    width:100%;
    padding:16px;
    border:2px solid #e3dbd3;
    background:#fcfaf8;
    border-radius:13px;
    font-size:15px;
    text-align:left;
    cursor:pointer;
    transition:.2s;
}

.answer:hover{
    border-color:#a57c5a;
    transform:translateX(3px);
}

.answer.correct{
    background:#e7f3e9;
    border-color:#6d9e76;
}

.answer.wrong{
    background:#f8e6e3;
    border-color:#bb7067;
}

.feedback{
    min-height:25px;
    margin-top:18px;
    font-weight:bold;
}

.result{
    text-align:center;
    padding:35px 10px;
}

.result .trophy{
    font-size:65px;
    margin-bottom:15px;
}

.result h2{
    font-size:35px;
    margin-bottom:12px;
}

.result p{
    color:#777;
    margin:10px;
    line-height:1.5;
}

.restart{
    margin-top:20px;
    border:0;
    background:#70513b;
    color:white;
    padding:14px 28px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

/* ================= CELULAR ================= */

@media(max-width:750px){

    .start-box{
        grid-template-columns:1fr;
    }

    .start-text{
        padding:35px 25px;
        order:2;
    }

    .start-text h1{
        font-size:38px;
    }

    .office{
        min-height:420px;
        order:1;
    }

    .content{
        grid-template-columns:1fr;
    }

    .scene{
        min-height:300px;
    }

    .card{
        padding:24px 18px;
    }

    .question{
        font-size:21px;
    }
}

@media(max-width:500px){

    .scene{
        min-height:270px;
    }

    .scene .person{
        transform:translateX(-50%) scale(.62);
        bottom:65px;
    }

    .scene .desk{
        bottom:65px;
    }

    .scene .monitor{
        bottom:90px;
    }

    .scene .cup{
        bottom:95px;
    }

    .character-name{
        bottom:10px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     PANTALLA DE INICIO
===================================================== -->

<section class="start" id="start">

<div class="start-box">

<div class="start-text">

<div class="tag">
JUEGO INTERACTIVO · GESTIÓN DEL TIEMPO
</div>

<h1>¡Buenos días!</h1>

<p>
Una nueva jornada laboral comienza.
Tendrás que enfrentarte a diferentes situaciones,
organizar tus prioridades y tomar decisiones.
<br><br>

<strong>¿Estás listo para comenzar?</strong>
</p>

<button class="start-button" onclick="startGame()">
▶ EMPEZAR JORNADA
</button>

</div>

<div class="office">

<div class="window"></div>
<div class="desk"></div>
<div class="monitor"></div>
<div class="cup"></div>

<div class="person p1">

<div class="hair"></div>

<div class="head">
<div class="eye one"></div>
<div class="eye two"></div>
<div class="mouth"></div>
</div>

<div class="body">
<div class="shirt"></div>
<div class="badge">GESTIÓN</div>
<div class="arm left"></div>
<div class="arm right"></div>
</div>

</div>

</div>

</div>

</section>


<!-- =====================================================
     JUEGO
===================================================== -->

<section class="game" id="game">

<header class="header">

<div class="logo">
☕ MI JORNADA LABORAL
</div>

<div class="points" id="points">
⭐ 0 puntos
</div>

</header>


<div class="content">

<div class="scene">

<div class="scene-office">

<div class="window"></div>
<div class="desk"></div>
<div class="monitor"></div>
<div class="cup"></div>

<div class="person" id="character">

<div class="hair"></div>

<div class="head">
<div class="eye one"></div>
<div class="eye two"></div>
<div class="mouth"></div>
</div>

<div class="body">
<div class="shirt"></div>
<div class="badge">OFICINA</div>
<div class="arm left"></div>
<div class="arm right"></div>
</div>

</div>

</div>

<div class="character-name" id="characterName">
Tu compañera
</div>

</div>


<div class="card" id="card"></div>

</div>

</section>


<script>

/* ================= PERSONAJES ================= */

const characters=[

{name:"Laura · Atención al cliente",class:"p1"},
{name:"Daniel · Tecnología",class:"p2"},
{name:"Camila · Comunicaciones",class:"p3"},
{name:"Andrés · Coordinador",class:"p4"},
{name:"Valentina · Recursos Humanos",class:"p5"},
{name:"Sebastián · Finanzas",class:"p6"},
{name:"Mariana · Asistente",class:"p7"},
{name:"Carlos · Gerencia",class:"p8"}

];


/* ================= PREGUNTAS ================= */

const questions=[

{
q:"Laura acaba de recibir un mensaje de un cliente que tiene un problema y necesita solución hoy. ¿Qué debería hacer?",
a:[
"Dejarlo para el final de la jornada.",
"Atenderlo porque es importante y urgente.",
"Revisar primero las redes sociales.",
"Esperar a que alguien más lo solucione."
],
correct:1
},

{
q:"Daniel tiene una presentación importante para mañana. Todavía tiene tiempo para prepararla. ¿Qué debería hacer?",
a:[
"Esperar hasta mañana.",
"Planificarla y comenzar a trabajar con anticipación.",
"Ignorarla por ahora.",
"Hacer solamente tareas fáciles."
],
correct:1
},

{
q:"Camila está concentrada en una tarea cuando recibe varias notificaciones que no son urgentes. ¿Qué debería hacer?",
a:[
"Revisarlas inmediatamente.",
"Dejar todo lo que está haciendo.",
"Continuar con su tarea y revisarlas después.",
"Responderlas todas al mismo tiempo."
],
correct:2
},

{
q:"Andrés tiene una tarea que puede realizar otro integrante del equipo que cuenta con las habilidades necesarias. ¿Qué puede hacer?",
a:[
"Delegarla adecuadamente.",
"Hacerla siempre él.",
"Ignorarla.",
"Esperar hasta el último minuto."
],
correct:0
},

{
q:"Valentina tiene cinco tareas pendientes. ¿Cuál es una buena forma de empezar?",
a:[
"Hacerlas todas al mismo tiempo.",
"Escoger una al azar.",
"Identificar cuáles son importantes y urgentes.",
"Comenzar por la más sencilla."
],
correct:2
},

{
q:"Sebastián tiene una tarea urgente justo antes de una reunión. ¿Qué debería hacer?",
a:[
"Ignorar la reunión.",
"Organizar la prioridad y comunicar la situación si es necesario.",
"Abandonar ambas tareas.",
"Empezar otra actividad."
],
correct:1
},

{
q:"Mariana tiene una actividad que no es importante ni urgente. ¿Qué puede hacer?",
a:[
"Priorizarla.",
"Eliminarla o dejarla para después.",
"Hacerla inmediatamente.",
"Convertirla en urgente."
],
correct:1
},

{
q:"Carlos quiere mejorar la productividad de su equipo. ¿Cuál es uno de los principales beneficios de gestionar bien el tiempo?",
a:[
"Tener más tareas.",
"Estar ocupado todo el día.",
"Organizar prioridades y aprovechar mejor el tiempo.",
"Trabajar siempre bajo presión."
],
correct:2
}

];


let current=0;
let score=0;
let answered=false;


/* ================= SONIDOS ================= */

function playSound(type){

const AudioContext=
window.AudioContext||window.webkitAudioContext;

if(!AudioContext)return;

const ctx=new AudioContext();

const oscillator=ctx.createOscillator();
const gain=ctx.createGain();

oscillator.connect(gain);
gain.connect(ctx.destination);

if(type==="correct"){

oscillator.frequency.setValueAtTime(
600,ctx.currentTime
);

oscillator.frequency.setValueAtTime(
800,ctx.currentTime+.12
);

oscillator.frequency.setValueAtTime(
1000,ctx.currentTime+.24
);

}

if(type==="wrong"){

oscillator.frequency.setValueAtTime(
250,ctx.currentTime
);

oscillator.frequency.setValueAtTime(
170,ctx.currentTime+.16
);

}

if(type==="finish"){

oscillator.frequency.setValueAtTime(
500,ctx.currentTime
);

oscillator.frequency.setValueAtTime(
650,ctx.currentTime+.12
);

oscillator.frequency.setValueAtTime(
800,ctx.currentTime+.24
);

oscillator.frequency.setValueAtTime(
1000,ctx.currentTime+.36
);

}

gain.gain.setValueAtTime(
0.001,
ctx.currentTime
);

gain.gain.exponentialRampToValueAtTime(
0.15,
ctx.currentTime+.02
);

gain.gain.exponentialRampToValueAtTime(
0.001,
ctx.currentTime+.5
);

oscillator.start();

oscillator.stop(ctx.currentTime+.5);

}


/* ================= INICIAR ================= */

function startGame(){

document.getElementById("start").style.display="none";

document.getElementById("game").style.display="block";

current=0;
score=0;

showQuestion();

}


/* ================= PREGUNTA ================= */

function showQuestion(){

answered=false;

const q=questions[current];
const character=characters[current];

const person=document.getElementById("character");

person.className="person "+character.class;

document.getElementById("characterName").textContent=
character.name;

document.getElementById("card").innerHTML=`

<div class="progress">
SITUACIÓN ${current+1} DE ${questions.length}
</div>

<div class="question">
${q.q}
</div>

<div class="answers">

${q.a.map((answer,index)=>`

<button class="answer"
onclick="checkAnswer(${index})">

${answer}

</button>

`).join("")}

</div>

<div class="feedback" id="feedback"></div>

`;

}


/* ================= RESPONDER ================= */

function checkAnswer(selected){

if(answered)return;

answered=true;

const q=questions[current];

const buttons=document.querySelectorAll(".answer");

const feedback=document.getElementById("feedback");

if(selected===q.correct){

score++;

buttons[selected].classList.add("correct");

feedback.textContent="✓ ¡Excelente decisión!";

feedback.style.color="#4f8159";

playSound("correct");

}else{

buttons[selected].classList.add("wrong");

buttons[q.correct].classList.add("correct");

feedback.textContent="✕ No es la mejor opción.";

feedback.style.color="#a04f48";

playSound("wrong");

}

document.getElementById("points").textContent=
"⭐ "+score+" puntos";


/*
   ESPERA UN MOMENTO PARA QUE EL JUGADOR
   VEA SI ACERTÓ O FALLÓ.
   DESPUÉS AVANZA AUTOMÁTICAMENTE.
*/

setTimeout(()=>{

current++;

if(current>=questions.length){

finish();

}else{

showQuestion();

}

},1200);

}


/* ================= RESULTADO ================= */

function finish(){

playSound("finish");

const percentage=
(score/questions.length)*100;

let message;

if(percentage===100){

message=
"¡Perfecto! Has demostrado un excelente manejo de las prioridades.";

}else if(percentage>=75){

message=
"¡Muy bien! Tienes excelentes bases para gestionar tu tiempo.";

}else if(percentage>=50){

message=
"¡Buen trabajo! Con un poco más de práctica podrás mejorar.";

}else{

message=
"¡No te preocupes! Cada jornada es una oportunidad para aprender.";

}

document.getElementById("card").innerHTML=`

<div class="result">

<div class="trophy">🏆</div>

<h2>¡Jornada completada!</h2>

<p>
Conseguiste
<strong>${score} de ${questions.length}</strong>
respuestas correctas.
</p>

<p>${message}</p>

<button class="restart" onclick="restart()">
🔄 COMENZAR OTRA JORNADA
</button>

</div>

`;

document.getElementById("characterName").textContent=
"¡Excelente jornada!";

}


/* ================= REINICIAR ================= */

function restart(){

current=0;
score=0;

document.getElementById("points").textContent=
"⭐ 0 puntos";

showQuestion();

}

</script>

</body>
</html>

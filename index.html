<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestiona tu tiempo</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f1ec;
        color: #2f2f2f;
        min-height: 100vh;
    }

    .header {
        background: #ffffff;
        border-bottom: 1px solid #ddd7cf;
        padding: 22px 7%;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .brand {
        font-size: 22px;
        font-weight: 700;
        color: #604b3b;
    }

    .progress {
        font-size: 14px;
        color: #777;
    }

    .container {
        width: min(900px, 92%);
        margin: 45px auto;
    }

    .intro {
        text-align: center;
        margin-bottom: 30px;
    }

    .intro h1 {
        font-size: clamp(30px, 6vw, 48px);
        color: #40372f;
        margin-bottom: 12px;
    }

    .intro p {
        color: #777;
        font-size: 17px;
    }

    .office-card {
        background: #ffffff;
        border: 1px solid #ded8d0;
        border-radius: 18px;
        padding: 35px;
        box-shadow: 0 8px 25px rgba(60, 50, 40, 0.08);
    }

    .question-number {
        color: #8b6f56;
        font-size: 14px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 15px;
    }

    .question {
        font-size: 25px;
        line-height: 1.4;
        color: #302a25;
        margin-bottom: 28px;
    }

    .answers {
        display: grid;
        gap: 14px;
    }

    .answer {
        width: 100%;
        padding: 18px 20px;
        border: 1px solid #d8d1c8;
        border-radius: 12px;
        background: #faf9f7;
        color: #403a35;
        text-align: left;
        font-size: 16px;
        cursor: pointer;
        transition: all .2s ease;
    }

    .answer:hover {
        border-color: #9a7b5d;
        background: #f3eee8;
        transform: translateY(-2px);
    }

    .answer.correct {
        background: #e8f3eb;
        border-color: #6b9b76;
        color: #315f3c;
    }

    .answer.wrong {
        background: #f8e9e7;
        border-color: #b8756c;
        color: #813f38;
    }

    .feedback {
        min-height: 28px;
        margin-top: 20px;
        text-align: center;
        font-weight: bold;
    }

    .score {
        text-align: center;
        margin-top: 22px;
        color: #777;
    }

    .next-btn,
    .restart-btn {
        display: block;
        margin: 25px auto 0;
        border: none;
        border-radius: 10px;
        padding: 14px 30px;
        background: #604b3b;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: .2s;
    }

    .next-btn:hover,
    .restart-btn:hover {
        background: #49382c;
        transform: translateY(-2px);
    }

    .hidden {
        display: none;
    }

    .result {
        text-align: center;
        padding: 20px;
    }

    .result-icon {
        font-size: 48px;
        margin-bottom: 15px;
    }

    .result h2 {
        font-size: 32px;
        color: #40372f;
        margin-bottom: 12px;
    }

    .result p {
        color: #777;
        font-size: 18px;
    }

    @media (max-width: 600px) {
        .header {
            padding: 18px 5%;
        }

        .container {
            margin: 25px auto;
        }

        .office-card {
            padding: 24px 18px;
        }

        .question {
            font-size: 21px;
        }

        .answer {
            font-size: 15px;
            padding: 16px;
        }
    }
</style>
</head>

<body>

<header class="header">
    <div class="brand">GESTIÓN DEL TIEMPO</div>
    <div class="progress" id="progress">Pregunta 1 de 8</div>
</header>

<main class="container">

    <div class="intro">
        <h1>¿Qué tan bien gestionas tu tiempo?</h1>
        <p>Analiza cada situación y toma la mejor decisión.</p>
    </div>

    <section class="office-card" id="game"></section>

</main>

<script>

const questions = [
    {
        question: "Tienes una reunión importante en 20 minutos, pero también debes responder varios correos que pueden esperar. ¿Qué haces?",
        answers: [
            "Dejar la reunión y responder todos los correos.",
            "Prepararte para la reunión y dejar los correos para después.",
            "Responder primero los correos menos importantes.",
            "Ignorar la reunión."
        ],
        correct: 1
    },

    {
        question: "Un cliente tiene un problema urgente que necesita solución inmediata. ¿Cómo lo clasificas?",
        answers: [
            "Importante y urgente.",
            "Importante pero no urgente.",
            "No importante y no urgente.",
            "Solo urgente."
        ],
        correct: 0
    },

    {
        question: "Tienes una tarea importante, pero su fecha de entrega es dentro de una semana. ¿Qué deberías hacer?",
        answers: [
            "Esperar hasta el último día.",
            "Planificarla y avanzar poco a poco.",
            "Ignorarla por ahora.",
            "Hacer primero tareas menos importantes."
        ],
        correct: 1
    },

    {
        question: "Recibes una notificación mientras estás concentrado en una tarea. ¿Cuál es la mejor opción?",
        answers: [
            "Revisarla inmediatamente.",
            "Abandonar la tarea.",
            "Continuar concentrado y revisarla después.",
            "Responder solo una y luego todas."
        ],
        correct: 2
    },

    {
        question: "Una tarea no es importante ni urgente. ¿Qué puedes hacer?",
        answers: [
            "Priorizarla sobre todo.",
            "Eliminarla o dejarla para después.",
            "Hacerla inmediatamente.",
            "Convertirla en urgente."
        ],
        correct: 1
    },

    {
        question: "Tienes varias tareas importantes para hoy. ¿Qué te ayuda a organizarte mejor?",
        answers: [
            "Hacerlas todas al mismo tiempo.",
            "Trabajar sin ningún orden.",
            "Establecer prioridades.",
            "Escoger la más fácil y olvidar las demás."
        ],
        correct: 2
    },

    {
        question: "Una tarea puede realizarla otra persona de tu equipo y no requiere directamente tu participación. ¿Qué opción puede ser adecuada?",
        answers: [
            "Delegarla.",
            "Hacerla tú siempre.",
            "Eliminarla sin revisar.",
            "Posponerla indefinidamente."
        ],
        correct: 0
    },

    {
        question: "¿Cuál es uno de los principales beneficios de organizar correctamente tu tiempo?",
        answers: [
            "Tener más tareas.",
            "Trabajar siempre bajo presión.",
            "Mejorar la productividad y reducir el estrés.",
            "Evitar todas las responsabilidades."
        ],
        correct: 2
    }
];

let current = 0;
let score = 0;
let answered = false;

const game = document.getElementById("game");
const progress = document.getElementById("progress");

/* Sonidos creados directamente con Web Audio.
   No necesitas descargar archivos de audio. */

function playSound(type) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;

    if (!AudioContext) return;

    const ctx = new AudioContext();
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    if (type === "correct") {
        oscillator.frequency.setValueAtTime(660, ctx.currentTime);
        oscillator.frequency.setValueAtTime(880, ctx.currentTime + 0.12);
    }

    if (type === "wrong") {
        oscillator.frequency.setValueAtTime(220, ctx.currentTime);
        oscillator.frequency.setValueAtTime(160, ctx.currentTime + 0.15);
    }

    if (type === "finish") {
        oscillator.frequency.setValueAtTime(523, ctx.currentTime);
        oscillator.frequency.setValueAtTime(659, ctx.currentTime + 0.12);
        oscillator.frequency.setValueAtTime(784, ctx.currentTime + 0.24);
    }

    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);

    oscillator.start();
    oscillator.stop(ctx.currentTime + 0.45);
}

function showQuestion() {

    answered = false;

    const q = questions[current];

    progress.textContent =
        `Pregunta ${current + 1} de ${questions.length}`;

    game.innerHTML = `
        <div class="question-number">
            Situación ${current + 1}
        </div>

        <div class="question">
            ${q.question}
        </div>

        <div class="answers">
            ${q.answers.map((answer, index) => `
                <button class="answer"
                    onclick="checkAnswer(${index})">
                    ${answer}
                </button>
            `).join("")}
        </div>

        <div class="feedback" id="feedback"></div>

        <div class="score">
            Puntaje: <strong>${score}</strong>
        </div>

        <button class="next-btn hidden" id="nextBtn"
            onclick="nextQuestion()">
            ${current === questions.length - 1 ? "Ver resultado" : "Siguiente"}
        </button>
    `;
}

function checkAnswer(selected) {

    if (answered) return;

    answered = true;

    const q = questions[current];
    const buttons = document.querySelectorAll(".answer");
    const feedback = document.getElementById("feedback");
    const nextBtn = document.getElementById("nextBtn");

    buttons[selected].classList.add(
        selected === q.correct ? "correct" : "wrong"
    );

    if (selected === q.correct) {

        score++;

        feedback.textContent = "✓ ¡Correcto!";
        feedback.style.color = "#4d7b58";

        playSound("correct");

    } else {

        buttons[q.correct].classList.add("correct");

        feedback.textContent = "✕ No es la mejor opción.";
        feedback.style.color = "#9a5148";

        playSound("wrong");
    }

    document.querySelector(".score").innerHTML =
        `Puntaje: <strong>${score}</strong>`;

    nextBtn.classList.remove("hidden");
}

function nextQuestion() {

    current++;

    if (current >= questions.length) {
        showResult();
    } else {
        showQuestion();
    }
}

function showResult() {

    progress.textContent = "Juego terminado";

    playSound("finish");

    let message = "";

    const percentage = (score / questions.length) * 100;

    if (percentage === 100) {
        message = "¡Excelente! Tienes una muy buena capacidad para priorizar.";
    } else if (percentage >= 75) {
        message = "¡Muy bien! Tienes buenas habilidades para gestionar tu tiempo.";
    } else if (percentage >= 50) {
        message = "Vas por buen camino. Puedes mejorar tus prioridades.";
    } else {
        message = "¡A seguir practicando! La organización se aprende con práctica.";
    }

    game.innerHTML = `
        <div class="result">

            <div class="result-icon">✓</div>

            <h2>¡Juego terminado!</h2>

            <p>
                Obtuviste
                <strong>${score} de ${questions.length}</strong>
                respuestas correctas.
            </p>

            <p style="margin-top:15px;">
                ${message}
            </p>

            <button class="restart-btn" onclick="restartGame()">
                Jugar nuevamente
            </button>

        </div>
    `;
}

function restartGame() {

    current = 0;
    score = 0;

    showQuestion();
}

showQuestion();

</script>

</body>
</html>
